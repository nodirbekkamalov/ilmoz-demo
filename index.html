<!doctype html>
<html lang="uz">
<head>

<body>
  <div class="app-shell">

        <div class="mobile-brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-6 10 6-10 6-10-6Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></span><strong>Ilmoz</strong></div>
        <div class="breadcrumb"><strong>Ilmoz</strong><span>/</span><span>Orbit Academy</span></div>

          <span class="language">UZ</span><span class="avatar">AK</span><span class="profile-copy"><strong>Akmal Karimov</strong><small>Owner</small></span>

      <nav class="mobile-nav" id="mobile-nav" aria-label="Mobil navigatsiya">
        <button class="active" type="button" data-view="dashboard" aria-label="Boshqaruv" aria-pressed="true">⌂</button>
        <button type="button" data-view="groups" aria-label="Guruhlar" aria-pressed="false">♙</button>
        <button type="button" data-view="schedule" aria-label="Jadval" aria-pressed="false">□</button>

      <main class="content">
        <div class="page-heading"><div><h1 id="page-title">Xayrli tong, Akmal</h1><p id="page-subtitle">Bugungi markaz holati va asosiy ko‘rsatkichlar</p></div><button class="report-button" type="button" id="report-button"><span>↗</span> Hisobot</button></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
